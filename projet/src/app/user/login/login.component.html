<!-- login.component.html -->
<div class="login-page">
  <app-nav-bar></app-nav-bar>

  <div class="login-wrapper">
    <div class="login-container">
      
      <div class="login-card">
        
        <!-- Section Image -->
        <div class="login-image">
          <div class="image-overlay">
            <div class="welcome-text">
              <h2>Bienvenue sur <span class="brand-highlight">Evo-Blog</span></h2>
              <p>Rejoignez notre communauté de passionnés de technologie</p>
            </div>
          </div>
          <img src="/assets/istockphoto-1429201424-612x612.jpg" alt="Login illustration">
        </div>

        <!-- Section Formulaire -->
        <div class="login-form-section">
          
          <div class="form-header">
            <div class="header-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <h1>Se connecter</h1>
            <p class="subtitle">Veuillez remplir le formulaire pour vous connecter</p>
          </div>

          <form [formGroup]="formulaire" class="login-form">
            
            <!-- Email Field -->
            <div class="form-group">
              <label for="email">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
                Adresse email
              </label>
              <input 
                type="email" 
                id="email"
                class="form-input" 
                formControlName="email"
                placeholder="exemple@email.com"
                [class.error]="formulaire.get('email')?.touched && formulaire.get('email')?.hasError('required')"
              >
              <div class="error-message" 
                   *ngIf="formulaire.get('email')?.touched && formulaire.get('email')?.hasError('required')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="8" x2="12" y2="12"/>
                  <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>Veuillez saisir votre adresse email</span>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Mot de passe
              </label>
              <input 
                type="password" 
                id="password"
                class="form-input" 
                formControlName="password"
                placeholder="••••••••"
                [class.error]="formulaire.get('password')?.touched && formulaire.get('password')?.hasError('required')"
              >
              <div class="error-message" 
                   *ngIf="formulaire.get('password')?.touched && formulaire.get('password')?.hasError('required')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="8" x2="12" y2="12"/>
                  <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>Veuillez saisir votre mot de passe</span>
              </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="form-options">
              <a href="#" class="forgot-link">Mot de passe oublié ?</a>
            </div>

            <!-- Submit Button -->
            <button type="button" class="submit-btn" (click)="submit()">
              <span>Se connecter</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>

            <!-- Sign Up Link -->
            <div class="signup-link">
              <p>Vous n'avez pas de compte ? 
                <a href="/signUp">Créer un compte</a>
              </p>
            </div>

          </form>

        </div>

      </div>

    </div>
  </div>

</div>
