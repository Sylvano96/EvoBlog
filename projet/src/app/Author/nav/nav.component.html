<!-- author-nav.component.html -->
<nav class="author-navbar">
  <div class="nav-container">
    
    <!-- Brand -->
    <a class="brand" (click)="onClick('author')" role="button">
      <span class="brand-text">Evo</span><span class="brand-accent">Blog</span>
      <span class="author-badge">Auteur</span>
    </a>

    <!-- Menu Toggle -->
    <button 
      class="menu-toggle" 
      (click)="toggleMenu()"
      [class.active]="isMenuOpen"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Menu -->
    <div class="nav-menu" [class.active]="isMenuOpen">
      
      <ul class="nav-links">
        <li>
          <button class="nav-btn" (click)="onClick('author')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Accueil</span>
          </button>
        </li>
        
        <li>
          <button class="nav-btn" (click)="onClick('create')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>Ajouter</span>
          </button>
        </li>
        
        <li>
          <button class="nav-btn" (click)="onClick('list')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Mes Posts</span>
          </button>
        </li>
      </ul>

      <!-- User Info & Logout -->
      <div class="nav-actions">
        <div class="user-info">
          <div class="user-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <span class="user-name">{{userName}}</span>
        </div>

        <button class="logout-btn" (click)="logOut()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Déconnexion</span>
        </button>
      </div>

    </div>

  </div>
</nav>
