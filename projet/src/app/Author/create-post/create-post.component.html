<app-nav></app-nav>

<div class="post-create container">

  <h2 class="page-title text-center">✍️ Créer un nouveau post</h2>

  <div class="post-layout">

    <!-- ✅ FORMULAIRE -->
    <div class="card modern-card">
      <form [formGroup]="title">
        <label>Titre du post</label>
        <input type="text" class="form-control" formControlName="title" placeholder="Entrez le titre...">
        <small class="error" *ngIf="title.get('title')?.touched && title.get('title')?.hasError('required')">
          Le titre est requis.
        </small>
        <button class="btn btn-primary w-100 mt-3" (click)="submitAddUp()">AJOUTER/MODIFIER</button>
      </form>

      <div class="form-group mt-3">
        <label>Catégorie</label>
        <select class="form-select" (change)="modifyCat($event)">
          <option disabled selected>Choisir une catégorie...</option>
          <option value="Actualités technologique">Actualités Tech</option>
          <option value="Intelligence Artificielle">Intelligence Artificielle</option>
          <option value="Technologie Mobile">Technologie Mobile</option>
          <option value="Innovations Emergantes">Innovations Emergantes</option>
          <option value="Gadgets et Wearables">Gadgets et Wearables</option>
          <option value="Sécurité Informatique">Sécurité Informatique</option>
        </select>
      </div>

      <form [formGroup]="formulaire" class="mt-3">
        <label>Image</label>
        <input type="file" class="form-control" (change)="onFileSelected($event)">
        <small class="error" *ngIf="errorMessage">{{ errorMessage }}</small>

        <label class="mt-3">Titre du paragraphe</label>
        <input type="text" class="form-control" formControlName="titlePara" placeholder="Sous-titre">
        <small class="error" *ngIf="formulaire.get('titlePara')?.touched && formulaire.get('titlePara')?.hasError('required')">
          Le titre du paragraphe est requis.
        </small>

        <label class="mt-3">Contenu</label>
        <textarea rows="4" class="form-control" formControlName="content"
        placeholder="Décrivez votre idée..."></textarea>
        <small class="error" *ngIf="formulaire.get('content')?.touched && formulaire.get('content')?.hasError('required')">
          La description est requise.
        </small>

        <button class="btn btn-primary w-100 mt-3" (click)="submit()">Ajouter le paragraphe</button>
      </form>
    </div>

    <!-- ✅ APERCU DU POST -->
    <div class="card modern-card preview-card">
      <h4 class="text-center">{{ titleDis || "Aperçu du post" }}</h4>
      <p class="category text-center" *ngIf="categorie">Catégorie : {{ categorie }}</p>

      <div class="image-preview" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Aperçu">
      </div>

      <div *ngFor="let item of data" class="preview-block mt-2">
        <div class="preview-header">
          <h6>{{ item.titlePara }}</h6>
          <div class="actions">
            <i class="fas fa-pen-to-square edit-icon" (click)="update(item.id)"></i>
            <button class="btn-close" (click)="deletePara(item.id)"></button>
          </div>
        </div>
        <p>{{ item.content }}</p>
      </div>

      <div class="action-buttons mt-3 text-center">
        <button class="btn btn-primary mx-1" (click)="poster()">Publier</button>
        <button class="btn btn-success mx-1" (click)="nonPoster()">Sauvegarder</button>
      </div>

      <p *ngIf="erreurPost" class="error text-center mt-3">Informations manquantes !</p>
    </div>

  </div>
</div>

<div *ngIf="addSuccess" class="alert alert-success success-popup">
  ✅ Ajout réussi !
</div>
