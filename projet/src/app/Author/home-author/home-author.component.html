<app-nav></app-nav>

<section class="author-hero container">
  <div class="author-profile">
    <div class="profile-image">
      <img [src]="img" alt="Auteur">
    </div>

    <div class="profile-content">
      <h2>Bienvenue, Cher Auteur ✍️</h2>
      <p class="quote">
        “Écrire, c’est partager une part de soi avec le monde. 
        Le blogging transforme des idées en impact et des histoires en connexions.”
      </p>

      <button class="btn btn-primary open-stats"
              data-bs-toggle="modal" 
              data-bs-target="#exampleModal">
        Voir mes statistiques 📊
      </button>
    </div>
  </div>
</section>

<!-- ✅ Modal amélioré -->
<div class="modal fade" id="exampleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Résumé de vos publications</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="stats-cards">
          <div class="stat-card stat-published">
            <span class="label">Publiés ✅</span>
            <span class="value">200</span>
          </div>
          <div class="stat-card stat-unpublished">
            <span class="label">Non publiés 🕓</span>
            <span class="value">123</span>
          </div>
        </div>

        <div class="chart-container">
          <canvas #chartCanvas></canvas>
        </div>
      </div>

    </div>
  </div>
</div>
