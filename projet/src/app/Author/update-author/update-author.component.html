<app-nav></app-nav>

<div class="container my-4">
  <h2 class="page-title">Modifier un Post</h2>

  <div class="edit-wrapper">
    
    <!-- Formulaire de modification -->
    <div class="card edit-card shadow-sm">
      
      <!-- Titre du Post -->
      <form [formGroup]="title">
        <label class="form-label">Titre du post</label>
        <input type="text" class="form-control" formControlName="title">

        <p class="error" *ngIf="title.get('title')?.touched && title.get('title')?.hasError('required')">
          Champ titre vide
        </p>
        <p class="error" *ngIf="formulaire.get('title')?.touched && formulaire.get('title')?.hasError('maxlength')">
          Le titre ne doit pas dépasser 70 caractères
        </p>

        <button class="btn btn-warning w-100 mt-3" (click)="submitAddUp()">
          Ajouter / Modifier
        </button>
      </form>

      <!-- Catégorie -->
      <label class="form-label mt-3">Catégorie</label>
      <select class="form-select" (change)="modifyCat($event)">
        <option value="Actualités technologique">Actualités Tech</option>
        <option value="Intelligence Artificielle">Intelligence Artificielle</option>
        <option value="Technologie Mobile">Technologie Mobile</option>
        <option value="Innovations Emergantes">Innovations Emergentes</option>
        <option value="Gadgets et Wearables">Gadgets et Wearables</option>
        <option value="Technologie et Environnement">Technologie et Environnement</option>
        <option value="Sécurité Informatique">Sécurité Informatique</option>
        <option value="Technologie et Santé">Technologie et Santé</option>
        <option value="Technologie et Société">Technologie et Société</option>
        <option value="Futur et Futurologie">Futur et Futurologie</option>
      </select>

      <!-- Paragraphe Form -->
      <form [formGroup]="formulaire" class="mt-3">
        <label class="form-label">Image</label>
        <input type="file" class="form-control" (change)="onFileSelected($event)">
        <p class="error" *ngIf="errorMessage">{{errorMessage}}</p>

        <label class="form-label mt-3">Titre du paragraphe</label>
        <input type="text" class="form-control" formControlName="titlePara">
        <p class="error" *ngIf="formulaire.get('titlePara')?.touched && formulaire.get('titlePara')?.hasError('required')">
          Le titre de paragraphe est vide
        </p>

        <label class="form-label mt-3">Description</label>
        <textarea class="form-control" rows="3" formControlName="content"></textarea>
        <p class="error" *ngIf="formulaire.get('content')?.touched && formulaire.get('content')?.hasError('required')">
          Description vide
        </p>

        <button class="btn btn-primary w-100 mt-3" (click)="submit()">
          Ajouter le paragraphe
        </button>
      </form>
      
    </div>

    <!-- Aperçu -->
    <div class="card preview-card shadow-sm">
      <h4 class="text-center post-title">{{titleDis}}</h4>
      <p class="text-center fw-semibold">Catégorie : {{categorie}}</p>

      <p *ngIf="erreurPost" class="error text-center">
        Titre ou description non définie
      </p>

      <div class="preview-img" *ngIf="imagePreview">
        <img [src]="imagePreview" class="img-fluid rounded">
      </div>

      <div *ngFor="let item of data" class="content-box">
        <div class="d-flex justify-content-between align-items-center">
          <h6>{{item.titlePara}}</h6>
          <div>
            <i class="fas fa-pen-to-square edit-icon" (click)="update(item.id)"></i>
            <button type="button" class="btn-close" (click)="deletePara(item.id)"></button>
          </div>
        </div>
        <p>{{item.content}}</p>
      </div>

      <div class="mt-3 text-center">
        <button class="btn btn-primary" (click)="poster()">Publier</button>
        <button *ngIf="status" class="btn btn-success ms-2" (click)="nonPoster()">Sauvegarder</button>
      </div>

    </div>

  </div>
</div>

<!-- Alert Success -->
<div *ngIf="addSuccess" class="alert alert-success alert-toast">
  Modification réussie ✅
</div>
