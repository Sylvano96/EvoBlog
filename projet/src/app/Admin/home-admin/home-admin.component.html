<app-nav-bar-admin></app-nav-bar-admin>

<div class="admin-container container my-4">

  <h2 class="title">Tableau de Bord</h2>

  <div class="stats-grid">
    <div class="stat-card published">
      <div class="icon"><i class="fas fa-check-circle"></i></div>
      <div>
        <p class="label">Total Publiés</p>
        <p class="value">{{nbPublie}}</p>
      </div>
    </div>

    <div class="stat-card not-published">
      <div class="icon"><i class="fas fa-times-circle"></i></div>
      <div>
        <p class="label">Non Publiés</p>
        <p class="value">{{nbNonPublie}}</p>
      </div>
    </div>

    <div class="stat-card posts-saved">
      <div class="icon"><i class="fas fa-database"></i></div>
      <div>
        <p class="label">Posts Enregistrés</p>
        <p class="value">{{nbPublie + nbNonPublie}}</p>
      </div>
    </div>

    <div class="stat-card writers">
      <div class="icon"><i class="fas fa-user-edit"></i></div>
      <div>
        <p class="label">Rédacteurs</p>
        <p class="value">{{nbRedac}}</p>
      </div>
    </div>
  </div>

  <h3 class="title mt-4">Statistiques</h3>

  <div class="charts-container">
    <div class='chart'>
        <canvas id="canvas"></canvas>
    </div>
    <div class='chart'>
        <canvas #chartCanvas></canvas>
    </div>
  </div>

</div>
